<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chromium внутри GTK</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: light dark; font: 16px system-ui, sans-serif; }
  body { margin: 0; background: #f6f5f4; color: #241f31; }
  main { max-width: 620px; margin: auto; padding: 80px 24px 32px; }
  h1 { font-size: 28px; margin: 8px 0; }
  .eyebrow { font-size: 12px; letter-spacing: .08em; color: #613583; font-weight: 700; }
  .card { background: white; padding: 20px; border-radius: 12px; margin-top: 24px; border: 1px solid #deddda; }
  label { display: block; margin-bottom: 8px; font-weight: 600; }
  input { box-sizing: border-box; width: 100%; padding: 12px; font: inherit; border: 1px solid #9a9996; border-radius: 6px; }
  button, a { display: inline-block; padding: 10px 16px; font: inherit; margin: 12px 8px 0 0; }
  button { border: none; border-radius: 6px; background: #3584e4; color: white; cursor: pointer; }
  p { line-height: 1.5; color: #5e5c64; }
  .track { height: 12px; background: #deddda; border-radius: 6px; overflow: hidden; }
  .bar { width: 30%; height: 100%; background: #26a269; animation: move 2s infinite alternate ease-in-out; }
  @keyframes move { to { transform: translateX(230%); } }
  canvas { width: 100%; height: 100px; border-radius: 6px; }
  :focus-visible { outline: 3px solid #3584e4; outline-offset: 3px; }
  @media(prefers-color-scheme:dark) { body{background:#242424;color:#fff} .card{background:#303030;border-color:#4a4a4a} p{color:#deddda} }
</style>
<main>
  <div class="eyebrow">BASTLE · NATIVE CHROMIUM PROBE</div>
  <h1>Chromium внутри GTK</h1>
  <p>Это тестовая веб-страница. Панель над ней создана настоящими элементами GTK и libadwaita.</p>
  <section class="card">
    <label for="input">Проверка ввода</label>
    <input id="input" placeholder="Введите текст на русском" autocomplete="off">
    <button id="button">Проверить нажатие</button><a href="/next.html">Проверить переход</a>
    <output id="result" aria-live="polite"></output>
  </section>
  <section class="card"><label>Анимация</label><div class="track"><div class="bar"></div></div></section>
  <section class="card"><label>WebGL</label><canvas id="gpu" width="500" height="100"></canvas><p id="gpu-status"></p></section>
  <section class="card"><label>Прокрутка и доступность</label><p>Скринридер должен читать этот текст и находить поле ввода, кнопку и ссылку как отдельные элементы страницы.</p></section>
</main>
<script>
document.addEventListener('keydown', event => console.log('BASTLE_KEY:' + JSON.stringify({key:event.key, target:event.target.id, shift:event.shiftKey, trusted:event.isTrusted})));
document.addEventListener('focusin', event => console.log('BASTLE_FOCUS:' + event.target.id));
document.querySelector('#button').onclick = event => {
  document.querySelector('#result').textContent = 'Нажатие получено';
  console.log('BASTLE_CLICK:ok');
  console.log('BASTLE_CLICK_TRUSTED:' + event.isTrusted);
};
document.querySelector('#input').oninput = event => console.log('BASTLE_INPUT:' + event.target.value);
const gl = document.querySelector('#gpu').getContext('webgl');
if (gl) { gl.clearColor(.2,.52,.89,1); gl.clear(gl.COLOR_BUFFER_BIT); }
document.querySelector('#gpu-status').textContent = gl ? 'Контекст WebGL создан' : 'WebGL недоступен';
console.log('BASTLE_WEBGL:' + !!gl);
</script>
</html>
